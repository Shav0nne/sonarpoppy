<!DOCTYPE html>
<html>
<head>
    <title>Spotify Web Playback - SonarPoppy</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 4px;
        }

        button {
            background: #1DB954;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1ed760;
        }

        .status {
            margin: 10px 0;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }

        .track-list {
            list-style: none;
            padding: 0;
        }

        .track-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .track-item:hover {
            background: #282828;
        }

        .track-info {
            flex-grow: 1;
        }

        .play-btn {
            background: transparent;
            border: 1px solid #fff;
            padding: 5px 10px;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #ff5555;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Spotify Player</h1>

    <div id="auth-section">
        <h3>Authentication</h3>
        <input id="jwt-input" placeholder="Enter JWT Token (or login to app)" style="width: 100%;" type="text">
        <br>
        <button onclick="checkAuth()">Use Token</button>
        <div class="hidden" id="spotify-connect">
            <p>Spotify not connected.</p>
            <button onclick="linkSpotify()">Link Spotify Account</button>
        </div>
        <div class="status hidden" id="player-status">Checking connection...</div>
    </div>

    <div class="hidden" id="player-controls">
        <h3>Now Playing</h3>
        <div id="current-track">Not playing</div>
        <button id="togglePlay">Play/Pause</button>
        <button id="nextTrack">Next</button>
        <button id="prevTrack">Previous</button>
        <div id="device-id">Device ID: <span id="device-id-val">Waiting...</span></div>
    </div>

    <hr>

    <div class="hidden" id="search-section">
        <h3>Search Spotify</h3>
        <input id="search-query" placeholder="Search for tracks..." type="text">
        <button onclick="searchSpotify()">Search</button>
        <ul class="track-list" id="search-results"></ul>
    </div>

    <hr>

    <div class="hidden" id="db-tracks-section">
        <h3>My Saved Tracks (DB)</h3>
        <button onclick="loadDbTracks()">Load Tracks</button>
        <ul class="track-list" id="db-tracks-list"></ul>
    </div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
    let accessToken = null;
    let deviceId = null;
    let player = null;

    // Check for token in URL params (from callback redirect)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('connected') === 'true') {
        document.getElementById('player-status').innerText = "Spotify Connected! Please re-enter your app JWT to initialize player.";
        // Ideally we should persist the JWT or re-fetch it.
        // For now, let user input it again or retrieve from localStorage.
    }

    // Auto-fill from localStorage if available
    const savedToken = localStorage.getItem('token');
    if (savedToken) {
        document.getElementById('jwt-input').value = savedToken;
        checkAuth();
    }

    async function checkAuth() {
        const token = document.getElementById('jwt-input').value;
        if (!token) {
            alert("Please enter a JWT token");
            return;
        }
        localStorage.setItem('token', token);

        try {
            // Fetch Spotify Access Token from backend
            const response = await fetch('/api/v1/auth/spotify/token', {
                headers: {'Authorization': `Bearer ${token}`}
            });

            if (response.status === 404) {
                document.getElementById('spotify-connect').classList.remove('hidden');
                document.getElementById('player-status').innerText = "Please link your Spotify account.";
            } else if (response.ok) {
                const data = await response.json();
                accessToken = data.accessToken;
                document.getElementById('player-status').innerText = "Spotify Access Token Acquired. Initializing Player...";
                document.getElementById('spotify-connect').classList.add('hidden');
                initPlayer();

                // Show UI
                document.getElementById('player-controls').classList.remove('hidden');
                document.getElementById('search-section').classList.remove('hidden');
                document.getElementById('db-tracks-section').classList.remove('hidden');
            } else {
                document.getElementById('player-status').innerText = "Error fetching token: " + response.statusText;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('player-status').innerText = "Error: " + err.message;
        }
    }

    function linkSpotify() {
        const token = document.getElementById('jwt-input').value;
        window.location.href = `/api/v1/auth/spotify/link?token=${token}`;
    }

    function initPlayer() {
        if (player) return; // Already init

        window.onSpotifyWebPlaybackSDKReady = () => {
            player = new Spotify.Player({
                name: 'SonarPoppy Web Player',
                getOAuthToken: cb => {
                    cb(accessToken);
                },
                volume: 0.5
            });

            player.addListener('ready', ({device_id}) => {
                console.log('Ready with Device ID', device_id);
                deviceId = device_id;
                document.getElementById('device-id-val').innerText = device_id;
                document.getElementById('player-status').innerText = "Player Ready";
            });

            player.addListener('not_ready', ({device_id}) => {
                console.log('Device ID has gone offline', device_id);
            });

            player.addListener('player_state_changed', state => {
                if (!state) return;
                document.getElementById('current-track').innerText =
                    state.track_window.current_track.name + " - " +
                    state.track_window.current_track.artists[0].name;
            });

            player.connect();
        };

        // If SDK script loaded before initPlayer called
        if (window.Spotify) {
            window.onSpotifyWebPlaybackSDKReady();
        }
    }

    document.getElementById('togglePlay').onclick = function () {
        if (player) player.togglePlay();
    };

    document.getElementById('nextTrack').onclick = function () {
        if (player) player.nextTrack();
    };

    document.getElementById('prevTrack').onclick = function () {
        if (player) player.previousTrack();
    };

    // --- Search Functionality ---
    async function searchSpotify() {
        const query = document.getElementById('search-query').value;
        if (!query) return;

        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track`, {
            headers: {'Authorization': `Bearer ${accessToken}`}
        });
        const data = await res.json();

        const list = document.getElementById('search-results');
        list.innerHTML = '';

        if (data.tracks && data.tracks.items) {
            data.tracks.items.forEach(track => {
                const li = document.createElement('li');
                li.className = 'track-item';
                li.innerHTML = `
                        <div class="track-info">
                            <strong>${track.name}</strong><br>
                            ${track.artists[0].name}
                        </div>
                        <button class="play-btn" onclick="playTrack('${track.uri}')">Play</button>
                    `;
                list.appendChild(li);
            });
        }
    }

    // --- DB Tracks Functionality ---
    async function loadDbTracks() {
        const token = document.getElementById('jwt-input').value;
        const res = await fetch('/api/v1/tracks?limit=20', {
            headers: {
                'Authorization': `Bearer ${token}`,
                'X-API-Key': ''
            }
        });
        const data = await res.json();

        const list = document.getElementById('db-tracks-list');
        list.innerHTML = '';

        // Response format { items: [...], _links: ... }
        if (data.items) {
            data.items.forEach(track => {
                const li = document.createElement('li');
                li.className = 'track-item';
                const hasSpotify = track.spotifyUri ? '' : 'disabled';
                const playAction = track.spotifyUri ? `playTrack('${track.spotifyUri}')` : "alert('No Spotify URI')";

                li.innerHTML = `
                        <div class="track-info">
                            <strong>${track.title}</strong><br>
                            ${track.artist}
                        </div>
                        <button class="play-btn" onclick="${playAction}" ${hasSpotify ? '' : 'style="opacity:0.5"'}>
                            ${hasSpotify ? 'Play' : 'No URI'}
                        </button>
                    `;
                list.appendChild(li);
            });
        }
    }

    // --- Play Specific URI ---
    async function playTrack(uri) {
        if (!deviceId) return alert("Player not ready");

        await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
            method: 'PUT',
            body: JSON.stringify({uris: [uri]}),
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${accessToken}`
            },
        });
    }
</script>
</body>
</html>
